[project]
name = "licita"
version = "0.1.0"
description = "Coleta e catalogação do corpus real de processos de compra (Licita R1)"
readme = "README.md"
authors = [
    { name = "Augusto", email = "augusto20060309@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
licita-corpus = "licita_corpus.collect:principal"
licita-gate = "licita_corpus.gate:principal"
licita-r2-esboco = "licita_core.r2_skeleton:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/licita_core", "src/licita_corpus", "src/licita_ingest", "src/licita_review"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=9.1.1",
]
